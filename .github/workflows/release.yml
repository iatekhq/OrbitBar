# Builds OrbitBar for Windows and publishes it as a GitHub Release.
#
#   Publish a version:  set APP_VERSION in orbitbar.py (e.g. "5.5.0"), add a "## 5.5.0" section to
#                       CHANGELOG.md, commit, then push a matching tag:  git tag v5.5.0 && git push origin v5.5.0
#   Test a build only:  Actions tab -> "Build release" -> Run workflow (the zip is attached to the run, no release)
name: Build release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Supply-chain hardening: every Action is pinned to an exact commit (a tag like @v4 can be moved to new code),
# and every Python package to an exact version + SHA-256 (requirements-lock.txt). Dependabot proposes updates.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write          # only to publish the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false   # don't leave the token in .git for the build steps

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies (exact versions, hashes checked)
        run: python -m pip install --require-hashes --no-deps -r requirements-lock.txt

      - name: Tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Select-String -Path orbitbar.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match APP_VERSION $v in orbitbar.py" }

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Smoke test (the program starts and exits)
        shell: pwsh
        run: |
          $p = Start-Process dist/OrbitBar/OrbitBar.exe -ArgumentList "--version" -PassThru
          if (-not $p.WaitForExit(90000)) {
            $p.Kill()
            throw "OrbitBar.exe didn't exit: a module is probably missing from the build (run ./build.ps1 -Console locally to see the error)"
          }
          if ($p.ExitCode -ne 0) { throw "OrbitBar.exe --version failed with exit code $($p.ExitCode)" }

      - name: Zip
        id: zip
        shell: pwsh
        run: |
          $name = "OrbitBar-${{ github.ref_name }}-windows.zip"
          Compress-Archive -Path dist/OrbitBar -DestinationPath $name
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $lines = Get-Content CHANGELOG.md
          $start = [array]::IndexOf($lines, "## $v")
          $notes = @()
          if ($start -ge 0) {
            for ($i = $start + 1; $i -lt $lines.Count -and -not $lines[$i].StartsWith("## "); $i++) { $notes += $lines[$i] }
          }
          if (-not ($notes -join "").Trim()) { $notes = @("See CHANGELOG.md.") }
          $notes += @("", "**Install:** download the zip below, unzip it to a folder you'll keep, run ``OrbitBar.exe``. Full guide in the README.")
          $notes | Set-Content notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # v2.6.2
        with:
          name: OrbitBar ${{ github.ref_name }}
          body_path: notes.md
          files: ${{ steps.zip.outputs.name }}

      - name: Keep the build (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: OrbitBar-test-build
          path: ${{ steps.zip.outputs.name }}
